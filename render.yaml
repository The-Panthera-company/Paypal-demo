# Render Blueprint: the core API (FastAPI), its Postgres database, and the website (Next.js).
# Render dashboard > New > Blueprint > pick this repo. Values marked sync: false are asked for once
# in the dashboard and never stored here.
services:
  - type: web
    name: giving-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: giving-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CURRENCY
        value: USD
      - key: STUB_EXAMPLES
        value: "true"
      # The website's URL must be listed here, or the browser blocks the PayPal button's calls.
      # After the first deploy, set it in the dashboard to: https://<giving-web>.onrender.com,http://localhost:3000
      - key: CORS_ORIGINS
        value: http://localhost:3000

  # Website (Person 2): donor pages, leaderboard, admin console.
  - type: web
    name: giving-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Full URL of giving-api, e.g. https://giving-api.onrender.com (no trailing slash).
      # Read at build time: after changing it, redeploy the website.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Server-only: lets the admin console call /admin/* on the API. Copied from the API service.
      - key: ADMIN_TOKEN
        fromService:
          type: web
          name: giving-api
          envVarKey: ADMIN_TOKEN
      # Password for /admin in the browser (any user name). Choose one; share it privately.
      - key: ADMIN_UI_PASSWORD
        sync: false
      # Giving assistant service (agents/). Fill in with https://<giving-agents>.onrender.com
      # after that service's first deploy, then REDEPLOY the website: this value is read at
      # build time, so an empty value here means the assistant is not wired up yet.
      - key: NEXT_PUBLIC_AGENTS_URL
        sync: false

  # Giving assistant (Person 3): FastAPI + the MCP server as a stdio child process.
  # Built from the repo ROOT because mcp-server/ lives outside agents/; see agents/Dockerfile.
  - type: web
    name: giving-agents
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./agents/Dockerfile
    healthCheckPath: /health
    # Deploy only after the CI checks pass, not on every commit to main.
    autoDeployTrigger: checksPass
    # Only rebuild when the agents or the MCP server change, not on every web/api commit.
    buildFilter:
      paths:
        - agents/**
        - mcp-server/**
    envVars:
      # Full URL of giving-api, e.g. https://giving-api.onrender.com (no trailing slash).
      # Set once in the dashboard, same pattern as giving-web's NEXT_PUBLIC_API_URL.
      - key: CORE_API_URL
        sync: false
      # The agents talk to giving-api's /internal/* routes with INTERNAL_TOKEN.
      - key: INTERNAL_TOKEN
        fromService:
          type: web
          name: giving-api
          envVarKey: INTERNAL_TOKEN
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      # Must include the website's origin or the browser blocks the assistant's calls.
      # Update to https://<giving-web>.onrender.com,http://localhost:3000 after the first deploy.
      - key: WEB_ORIGIN
        value: http://localhost:3000
      # FIRST DEPLOY: leave true. Every mutating MCP tool becomes a no-op that returns a
      # canned result, so the service runs end to end without writing. Set to "false" only
      # once the Watchdog and Milestone agents are real and writes are intended.
      - key: DRY_RUN
        value: "true"
      # Scheduler stays off until the agents are armed; the API is only polled on demand.
      - key: SCHEDULER_ENABLED
        value: "false"

databases:
  - name: giving-db
    plan: free
    databaseName: giving
    user: giving
