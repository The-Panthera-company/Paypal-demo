<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox Checkout Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 16px; color: #1a1a1a; background: #fff; }
    h1 { font-size: 1.3rem; }
    label { display: block; margin: .8rem 0 .3rem; font-weight: 600; }
    input, select { width: 100%; padding: .5rem; font-size: 1rem; box-sizing: border-box; }
    #paypal-button { margin-top: 1.5rem; }
    #log { margin-top: 1.5rem; background: #f4f4f4; padding: 1rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85rem; min-height: 3rem; }
    .note { color: #555; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>PayPal sandbox checkout test</h1>
  <p class="note">Sandbox only. Pay with a sandbox <b>personal</b> account, or the card option with a PayPal test card.</p>

  <label for="target">Target</label>
  <select id="target">
    <option value="PROJECT">Project</option>
    <option value="CATEGORY">Category</option>
  </select>
  <label for="target-id">Project / category ID</label>
  <input id="target-id" type="number" value="1" min="1">
  <label for="amount">Amount (<span id="currency">…</span>)</label>
  <input id="amount" type="number" value="20.00" min="0.01" step="0.01">

  <div id="paypal-button"></div>
  <div id="log">Loading PayPal config…</div>

  <script>
    const log = (msg, obj) => {
      const el = document.getElementById("log");
      el.textContent += "\n" + new Date().toLocaleTimeString() + "  " + msg + (obj ? "\n" + JSON.stringify(obj, null, 2) : "");
    };

    async function main() {
      const cfg = await (await fetch("/config/paypal")).json();
      document.getElementById("log").textContent = "";
      if (!cfg.client_id) return log("PAYPAL_CLIENT_ID is empty: fill in api/.env and restart the API.");
      document.getElementById("currency").textContent = cfg.currency;
      log(`Config: ${cfg.environment}, ${cfg.currency}`);

      const sdk = document.createElement("script");
      sdk.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.client_id)}&currency=${cfg.currency}&intent=capture&components=buttons`;
      sdk.onerror = () => log("Could not load the PayPal SDK (check the client ID).");
      sdk.onload = () => renderButtons();
      document.head.appendChild(sdk);
    }

    function renderButtons() {
      paypal.Buttons({
        createOrder: async () => {
          const target = document.getElementById("target").value;
          const id = Number(document.getElementById("target-id").value);
          const body = {
            target_type: target,
            [target === "PROJECT" ? "project_id" : "category_id"]: id,
            amount_cents: Math.round(Number(document.getElementById("amount").value) * 100),
          };
          log("POST /donations/orders", body);
          const r = await fetch("/donations/orders", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          const out = await r.json();
          log(`-> ${r.status}`, out);
          if (!r.ok) throw new Error(out.detail?.error || "create failed");
          return out.order_id;
        },
        onApprove: async (data, actions) => {
          log(`Approved order ${data.orderID}; capturing…`);
          const r = await fetch(`/donations/orders/${data.orderID}/capture`, { method: "POST" });
          const out = await r.json();
          log(`-> ${r.status}`, out);
          if (out.detail?.restart) { log("Declined: restarting so you can pick another method."); return actions.restart(); }
          if (r.ok) log(out.status === "captured" ? "✅ Donation captured." : `Status: ${out.status}`);
        },
        onCancel: () => log("Donor cancelled in the PayPal window."),
        onError: (err) => log("PayPal error: " + err),
      }).render("#paypal-button");
    }

    main().catch((e) => log("Failed: " + e));
  </script>
</body>
</html>
